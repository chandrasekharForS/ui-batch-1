<!DOCTYPE html>
<html>
    <head>
        <title>Javascript</title>
    </head>
    <body>
        <b>Sum of the two numbers is: <div id="result"></div></b>
        <script>
            let n1 = 10.56;
            let n2 = 20;

            let r = n1 + n2;

            document.getElementById("result").innerText = r;
        </script>
    </body>
</html>
