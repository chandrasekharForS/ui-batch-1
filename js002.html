<!DOCTYPE html>
<html>
    <head>
        <title>Caluculator</title>
    </head>
    <body>
        <h1>Caluculator</h1>
        <form>
            Enter number1: <input type="num" id="num1">
            <br/>
            Enter number2: <input type="num" id="num2">
            <br/>
            <input type="button" value="+" onclick="addition();">
            <input type="button" value="-" onclick="subtraction()">
            <input type="button" value="*" onclick="multiplication()">
            <input type="button" value="/" onclick="division()">
            
        </form>
        <br>
        <span id="result"></span>
    </body>
    <script>
        function addition(){
            let n1 = document.getElementById("num1").value;
            let n2 = document.getElementById("num2").value;

            let result = Number(n1) + Number(n2);

            document.getElementById("result").innerText="The sum: " + result;
        }

        function subtraction(){
            let n1 = document.getElementById("num1").value;
            let n2 = document.getElementById("num2").value;

            let result = Number(n1) - Number(n2);

            document.getElementById("result").innerText="The difference: " + result;
        }

        function multiplication(){
            let n1 = document.getElementById("num1").value;
            let n2 = document.getElementById("num2").value;

            let result = Number(n1) * Number(n2);

            document.getElementById("result").innerText="The product: " + result;
        }

        function division(){
            let n1 = document.getElementById("num1").value;
            let n2 = document.getElementById("num2").value;

            let result = Number(n1) / Number(n2);

            document.getElementById("result").innerText="The division: " + result;
        }

    </script>
</html>
