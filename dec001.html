<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvenListener</title>
</head>
<body>
    <button id="btn">Submit</button>
</body>
    <script>
        document.getElementById("btn").addEventListener("click", function() {
            alert("Hello Sunny.");
        });
    </script>
